# 本体管理平台的部署编排 —— **只跑平台本体**，中间件都按你现有的方式跑，不在这里。
#
#   cp .env.docker.example .env.docker   # 填连接信息与密钥（这个文件不要提交）
#   docker compose up -d --build         # 或 pnpm docker:up
#
# 平台之外的两个依赖，这里刻意不管：
#   - PostgreSQL：平台库（ontology_platform schema、对象检索索引）—— 不进编排
# Apache Jena Fuseki 在本编排里（见下面的 fuseki 服务）：它是本体存储，容器之间用服务名
# `fuseki:3030` 访问，不经过宿主机端口。
# 业务数据源（Oracle / PostgreSQL / MySQL）同样是被读取的外部系统，在「数据资源」里登记。
#
# 容器里访问宿主机上的服务要走 host.docker.internal（下面已经加了 host-gateway 映射）：
#   DATABASE_URL = postgresql://用户:密码@host.docker.internal:5432/库名
# 「本体存储」的 endpoint 存在平台库里的，可能是给宿主机写的 `http://localhost:3030/ds`：
# 容器里 localhost 是容器自己，所以用 GRAPH_ENDPOINT_HOST_ALIAS 把它改写成服务名
# （见下面 app 服务的 environment），平台库里那条登记一个字都不用改。

services:
  fuseki:
    image: ${FUSEKI_IMAGE:-stain/jena-fuseki:latest}
    container_name: ontology-fuseki
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      # 数据集名要和平台里登记的 endpoint 路径一致（默认 ds）。Fuseki 缺这个数据集时会自己建。
      FUSEKI_DATASET_1: ${FUSEKI_DATASET:-ds}
      # Fuseki 管理密码：**在 compose 里显式设死一个非空值**（不依赖 .env.docker，也不用随机生成）。
      # 原因是 `env_file` 里的变量不参与 compose 的变量替换：写成 `${VAR:?}` 那种必填插值，
      # 不带 --env-file 跑（Docker Desktop 上点按钮、IDE 里的 compose up）会直接报错；
      # 而留空又会让 Fuseki 自己随机生成一个（密码就不在你手上了）。
      # 想换密码：改这一行，或在 .env.docker 里设 FUSEKI_ADMIN_PASSWORD（用 pnpm docker:up 启动）。
      ADMIN_PASSWORD: ${FUSEKI_ADMIN_PASSWORD:-admin-studio}
    ports:
      # 宿主机端口只为「本机开发服务 + 浏览器打开 Fuseki 管理界面」保留；
      # 平台容器走服务名 fuseki:3030，不依赖这个映射。
      - "${FUSEKI_PORT:-3030}:3030"
    volumes:
      # FUSEKI_BASE 整个挂出来：数据集在 databases/ 下，config.ttl / shiro.ini 也在这里。
      # 默认落在项目 .data/fuseki（好备份，也方便从旧容器把数据搬过来）；也可以写成命名卷名字。
      # Linux 服务器上注意属主：镜像里的 fuseki 用户是 uid 100，绑定的宿主目录要 chown 100:101。
      - ${FUSEKI_DATA_DIR:-./.data/fuseki}:/fuseki
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3030/$/ping"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # 拉不动 Docker Hub 就换成镜像站，例如：
        #   NODE_IMAGE=docker.1ms.run/node:24-bookworm-slim
        # APP_PORT / VERSION_SNAPSHOT_DIR / NODE_IMAGE 都是给 compose 做变量替换的，
        # 写在 .env.docker 里即可 —— `pnpm docker:up` 带了 --env-file .env.docker。
        NODE_IMAGE: ${NODE_IMAGE:-node:24-bookworm-slim}
        # 依赖源：国内网络直连 registry.npmjs.org 会让构建里的 pnpm install 大面积超时。
        # 默认给镜像源，保证"不带 --env-file 直接 up"也装得动；要直连官方源就写完整地址覆盖。
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
    image: ontology-management:local
    container_name: ontology-platform
    restart: unless-stopped
    depends_on:
      # 只保证启动顺序：Fuseki 起不来时平台仍能起（图库相关的操作会如实报连不上）。
      fuseki:
        condition: service_started
    env_file:
      # 平台自己的变量都在这里：DATABASE_URL / AUTH_SECRET / TARGET_ENCRYPTION_KEY / LLM_* …
      - .env.docker
    environment:
      TZ: Asia/Shanghai
      PORT: "3000"
      # 版本快照落在卷里，容器重建不丢。
      ONTOLOGY_VERSION_DIR: /data/ontology-versions
      # 图库端点主机名改写：平台库里登记的是给宿主机写的 `http://localhost:3030/ds`，
      # 容器里 localhost 是容器自己 —— 换成同一个 compose 里的服务名即可。
      # 用的不是本编排里的 Fuseki（比如外面另有一台）时，把它设成那台的地址。
      GRAPH_ENDPOINT_HOST_ALIAS: ${GRAPH_ENDPOINT_HOST_ALIAS:-localhost=fuseki}
    ports:
      # 左边是宿主机端口：本机 3000 被占用时在 .env.docker 里设 APP_PORT=3100。
      - "${APP_PORT:-3000}:3000"
    extra_hosts:
      # Linux 上也能用 host.docker.internal 访问宿主机（Docker Desktop 本来就有这个别名）。
      - "host.docker.internal:host-gateway"
    # Linux 宿主机上还可以整段改用宿主网络：这时容器里的 localhost 就是宿主机，库里那些
    # localhost:3030 的 endpoint 一个字都不用改（此时 ports / extra_hosts 会被忽略）。
    # Windows / macOS 的 Docker Desktop 不支持 host 网络，只能用上面的 host.docker.internal。
    # network_mode: host
    volumes:
      # 版本快照目录（发布版本的本体文件）。它**是状态不是缓存**：库里记着"某本体的已发布版本"，
      # 而定义本身在这一份文件里 —— 换了机器不带过来，模型工具与发布都会说"还没有发布版本"。
      # 默认落项目 .data/ontology-versions —— 与本机开发服务用的是同一份，两个入口都能读到已发布的版本。
      # 想改用命名卷就把 VERSION_SNAPSHOT_DIR 写成卷名（例如 VERSION_SNAPSHOT_DIR=ontology-versions）。
      # Linux 服务器上注意属主：容器里的 node 用户是 uid 1000，宿主目录要么 chown -R 1000:1000，
      # 要么用命名卷（Docker 会按镜像里的属主建）。两套部署共用一个平台库时，快照目录必须是同一个。
      - ${VERSION_SNAPSHOT_DIR:-./.data/ontology-versions}:/data/ontology-versions
      # Oracle 的 Instant Client 已经装在镜像里（见 docker/oracle/），一般不用挂。
      # 想换成自备的 Linux 版客户端时才打开这行，并在 .env.docker 里设
      # ORACLE_CLIENT_LIB_DIR=/opt/oracle/instantclient（Windows 版的 dll 在容器里用不了）。
      # - ./.data/oracle-client:/opt/oracle/instantclient:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  ontology-versions:
