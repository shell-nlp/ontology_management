# 本体管理平台的部署编排 —— **只跑平台本体**，中间件都按你现有的方式跑，不在这里。
#
#   cp .env.docker.example .env.docker   # 填连接信息与密钥（这个文件不要提交）
#   docker compose up -d --build         # 或 pnpm docker:up
#
# 平台之外的依赖都不进编排：PostgreSQL 是平台库；Jena/Fuseki 是可选的外部图引擎。
# 业务数据源（Oracle / PostgreSQL / MySQL）同样是被读取的外部系统，在「数据资源」里登记。
#
# 唯一的例外是**对象索引库 ClickHouse**：它是平台的组成部分（对象实例的检索索引），
# 默认随 `docker compose up -d` 一起起来；只想跑平台本体、或已经有外部 ClickHouse 时，
# 用 `docker compose up -d app` 只起本体，并把 CLICKHOUSE_URL 指到外部服务。
#
# 容器里访问宿主机上的服务要走 host.docker.internal（下面已经加了 host-gateway 映射）：
#   DATABASE_URL = postgresql://用户:密码@host.docker.internal:5432/库名
# 已登记的 Jena endpoint 若指向宿主机的 localhost:3030，app 容器会通过
# GRAPH_ENDPOINT_HOST_ALIAS 改写为 host.docker.internal:3030；远端地址不变。

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # 拉不动 Docker Hub 就换成镜像站，例如：
        #   NODE_IMAGE=docker.1ms.run/node:24-bookworm-slim
        # APP_PORT / NODE_IMAGE 都是给 compose 做变量替换的，写在 .env.docker 里即可
        # —— `pnpm docker:up` 带了 --env-file .env.docker。
        NODE_IMAGE: ${NODE_IMAGE:-node:24-bookworm-slim}
        # 依赖源：国内网络直连 registry.npmjs.org 会让构建里的 pnpm install 大面积超时。
        # 默认给镜像源，保证"不带 --env-file 直接 up"也装得动；要直连官方源就写完整地址覆盖。
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
    image: ontology-management:local
    container_name: ontology-platform
    restart: unless-stopped
    env_file:
      # 平台自己的变量都在这里：DATABASE_URL / AUTH_SECRET / TARGET_ENCRYPTION_KEY / LLM_* …
      - .env.docker
    environment:
      TZ: Asia/Shanghai
      PORT: "3000"
      # 对象索引库 ClickHouse（列存）。默认指到编排里的 clickhouse 服务；
      # 用外部 ClickHouse 时在 .env.docker 里覆盖，例如 http://host.docker.internal:8123。
      CLICKHOUSE_URL: ${CLICKHOUSE_URL:-http://clickhouse:8123}
      CLICKHOUSE_DATABASE: ${CLICKHOUSE_DATABASE:-ontology_index}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-admin}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-admin}
      # 本体定义与快照都存在平台库；这个目录只在旧部署升级时被读一次，
      # 用来把磁盘上的历史版本迁进 ontology_platform.ontology_versions。
      ONTOLOGY_VERSION_DIR: /data/ontology-versions
      # 只改写 Jena 连接中登记的 localhost；外部服务若在别的主机，直接登记真实地址即可。
      GRAPH_ENDPOINT_HOST_ALIAS: ${GRAPH_ENDPOINT_HOST_ALIAS:-localhost=host.docker.internal}
    ports:
      # 左边是宿主机端口：本机 3000 被占用时在 .env.docker 里设 APP_PORT=3100。
      - "${APP_PORT:-3000}:3000"
    extra_hosts:
      # Linux 上也能用 host.docker.internal 访问宿主机（Docker Desktop 本来就有这个别名）。
      - "host.docker.internal:host-gateway"
    # Linux 宿主机上还可以整段改用宿主网络：这时容器里的 localhost 就是宿主机，库里那些
    # localhost:3030 的 endpoint 一个字都不用改（此时 ports / extra_hosts 会被忽略）。
    # Windows / macOS 的 Docker Desktop 不支持 host 网络，只能用上面的 host.docker.internal。
    # network_mode: host
    volumes:
      # 旧磁盘快照的**只读来源**，只服务于一次性迁移：本体定义与快照现在都写平台库
      # ontology_platform.ontology_versions，服务端第一次访问版本数据时会把这个目录里的历史版本
      # 迁进库、并删掉磁盘副本。全新部署用不到它，两套部署共用一个平台库时也不需要共享它。
      # 默认落项目 .data/ontology-versions；旧数据在别处时才用 VERSION_SNAPSHOT_DIR 指过去。
      # Linux 服务器上注意属主：容器里的 node 用户是 uid 1000，宿主目录要么 chown -R 1000:1000，
      # 要么用命名卷（Docker 会按镜像里的属主建）。
      - ${VERSION_SNAPSHOT_DIR:-./.data/ontology-versions}:/data/ontology-versions
      # Oracle 的 Instant Client 已经装在镜像里（见 docker/oracle/），一般不用挂。
      # 想换成自备的 Linux 版客户端时才打开这行，并在 .env.docker 里设
      # ORACLE_CLIENT_LIB_DIR=/opt/oracle/instantclient（Windows 版的 dll 在容器里用不了）。
      # - ./.data/oracle-client:/opt/oracle/instantclient:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  # 对象索引库：对象实例的检索索引落在列存里（定义与版本仍在平台库 PostgreSQL）。
  # 它是**派生数据**：随时可以从数据源与已发布快照重建，所以换机器不带数据也没关系。
  clickhouse:
    image: ${CLICKHOUSE_IMAGE:-clickhouse:26.9.8.3}
    container_name: ontology-clickhouse
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      # 首次启动时由镜像入口脚本建库建用户；已有数据卷时这几个变量不生效。
      CLICKHOUSE_DB: ${CLICKHOUSE_DATABASE:-ontology_index}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-admin}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-admin}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      # 本机开发服务（`pnpm dev`）用 localhost:8123 连的就是它；端口被占用时在 .env.docker 里改。
      - "${CLICKHOUSE_HTTP_PORT:-8123}:8123"
      - "${CLICKHOUSE_NATIVE_PORT:-9000}:9000"
    ulimits:
      # ClickHouse 官方要求：并发查询多时文件句柄要放大。
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  ontology-versions:
  # 对象索引数据卷。索引可重建，删掉它只会让检索为空，重新发布/重建索引即可。
  clickhouse-data:
